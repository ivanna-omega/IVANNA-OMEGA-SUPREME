name: Tests host (CTest)

# Flanco: Tests nativos host (CTest) — ver CLAIMS/tests-host-ctest.md.
# Workflow dedicado y aislado: NO reemplaza ni toca build.yml (daemon/Magisk)
# ni supply-chain.yml. Su única razón de existir: la puerta de regresión de
# todo el DSP en host, que antes no existía en ninguna parte.
#
# Historial: scripts/run_ctest.sh invocaba `cmake --preset host-release` con
# CMakePresets.json inexistente → fallaba garantizado. Hoy esa puerta corre
# en cada push/PR sobre las rutas que puede romper.

on:
  push:
    paths:
      - 'app/src/main/cpp/**'
      - 'tests/**'
      - 'scripts/run_ctest.sh'
      - 'scripts/check_*.py'
      - 'README.md'
      - 'LÉAME.md'
      - 'telemetry/**'
      - 'magisk_module/module.prop'
      - 'magisk_module/customize.sh'
      - 'research/deh6_optics/**'
      - '.github/workflows/tests-host.yml'
  pull_request:
    paths:
      - 'app/src/main/cpp/**'
      - 'tests/**'
      - 'scripts/run_ctest.sh'
      - 'scripts/check_*.py'
      - 'README.md'
      - 'LÉAME.md'
      - 'telemetry/**'
      - 'magisk_module/module.prop'
      - 'magisk_module/customize.sh'
      - 'research/deh6_optics/**'
      - '.github/workflows/tests-host.yml'
  # TSan no cabe en la puerta por-push: 2 cancelaciones medidas (corridas
  # 34166260673 y 34167465625 — jobs cancelados exactamente a los 20m15s y
  # 45m15s, ambos en pleno CTest) demuestran que en los runners de 2 núcleos
  # TSan necesita más de 45 min. Sale semanal y a demanda; el resto del
  # tiempo la regresión de concurrencia queda vigilada por los tests de
  # stress ya incluidos en la pata normal (test_control_frame_bus_stress,
  # test_audio_bus, DaemonThreadStress).
  schedule:
    - cron: '23 4 * * 1'   # lunes 04:23 UTC — evita la hora pico de GitHub
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida del push anterior que aún esté corriendo:
# la única corrida que importa es la del HEAD de main. Ahorra minutos de
# runner y evita colas cuando se encadenan pushes (patrón de este repo:
# commit breve + push por ciclo).
concurrency:
  group: tests-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PUERTA por push/PR: pata plana (la ASan+UBSan vive en self-hosted) ───
  # C4/510 — en la 509 el job ASan+UBSan murió por timeout a los 30 min
  # (1515/1835 tests, 0 fallos): un solo job hacía configurar + compilar
  # (enlace ASan de test_acoustic_harness >20 min) + ejecutar 1835 tests
  # en 2 núcleos. La pata ASan completa se movió a tests-selfhosted.yml
  # (job ctest-selfhosted-asan, timeout 120 min, sin minutos de GitHub,
  # también en PR); aquí queda solo la pata plana como puerta rápida
  # (el CTest plano tarda ~1 min). La matriz queda con un solo valor para
  # no tocar las referencias a matrix.san (nombre, artefacto C5, Fase 0).
  ctest:
    name: ${{ matrix.san == 'asan' && 'CTest (ASan+UBSan)' || 'CTest' }}
    runs-on: ubuntu-latest
    # 30 min: holgura amplia para la pata plana (~1 min); el enlace ASan
    # que lo reventaba en la 509 ya no corre en este job.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        san: ['']
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      IVANNA_SAN: ${{ matrix.san }}
    steps:
      - uses: actions/checkout@v7

      # FIX v2.5.408 — causa raíz del CTest host rojo desde la 402: el job
      # pone CC=clang-18 / CXX=clang++-18 pero NUNCA instalaba clang-18,
      # así que `cmake` fallaba con "CMAKE_CXX_COMPILER not set". El runner
      # ubuntu-latest trae clang por defecto, pero no el 18 con ese nombre.
      # FIX v2.5.411 — la 408 quedó obsoleta: el runner ahora trae libstdc++
      # 15 (headers en /usr/include/c++/15) y clang-18 NO compila el
      # <format> de libstdc++-15 ("call to immediate function ... is not a
      # constant expression"). gtest tira de <iomanip> → <format>, así que
      # TODA TU con gtest fallaba en compilación (corridas 409/410: CTest y
      # ASan+UBSan en rojo sin tocar código; la 409 solo tocó docs). El
      # compilador pasa a g++-14: es el compilador a juego con libstdc++-14
      # y soporta el C++26 que exige el proyecto (verificado en host VM:
      # CTest 961/962 con g++-14; el único fallo, test_perf_auditor, es un
      # test de wall-clock que pasa en solitario — carga del runner, no DSP).
      - name: Instalar g++-14 (compilador CTest)
        run: |
          if ! command -v g++-14 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq g++-14
          fi
          g++-14 --version | head -1

      - name: Instalar cmake (verificación explícita de versión)
        run: |
          cmake --version || { sudo apt-get update -qq && sudo apt-get install -y -qq cmake; }
          cmake --version | head -1

      # Verificación de no-regresión de la causa raíz corregida hoy:
      # CMakePresets.json NO debe reaparecer apuntando a nada muerto.
      - name: Pre-flight — sin presets fantasma
        run: |
          if [ -f CMakePresets.json ]; then
            echo "CMakePresets.json reapareció — run_ctest.sh ya no depende de él, pero revisa que no vuelva a romper la puerta de tests."; exit 1
          fi
          bash -n scripts/run_ctest.sh

      - name: Configurar, compilar y correr CTest (33→60 targets, GTest vendoreado, offline)
        run: |
          set -o pipefail
          bash scripts/run_ctest.sh | tee /tmp/ctest_run.log
          python3 scripts/check_docs_claims.py --generate-from-log /tmp/ctest_run.log

      # C5 (510) — publicar artefactos JUnit + log en CADA run, también al
      # cancelar por timeout. Causa raíz: en la 509 el job ASan+UBSan murió
      # por timeout a los 30 min (1515/1835 tests, 0 fallos) y el log murió
      # con el runner — para saber qué 320 tests no corrieron había que
      # re-correr. Diagnóstico sin re-correr: descargar el artefacto y
      # grep -E "Failed|Timeout" ctest_last.log. `if-no-files-found: warn`
      # porque si ctest muere por timeout del job, el JUnit (que ctest
      # escribe al final) puede no existir; el log sí sobrevive (tee).
      # Nombre por pata de la matriz: sin él, plain y ASan colisionarían
      # en el mismo artefacto.
      - name: Publicar artefactos CTest (log + JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ matrix.san == 'asan' && 'asan' || 'plain' }}
          path: |
            build/tests-host/ctest_last.log
            build/tests-host/ctest_junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fase 0 — Herramientas de verdad (0.1–0.5 + cppcheck + header_wiring)
        if: matrix.san == ''
        run: |
          set -euo pipefail
          # Cada chequeo emite una anotación ::error:: con su nombre y las últimas
          # líneas de salida, para que el fallo sea legible vía API/UI sin abrir logs.
          rc=0
          run_check() {
            local name="$1"; shift
            if ! out=$("$@" 2>&1); then
              echo "$out"
              echo "::error title=Fase 0 · ${name}::$(echo "$out" | tail -n 6 | tr '\n' ' ' | cut -c1-900)"
              rc=1
            else
              echo "$out" | tail -n 3
            fi
          }
          run_check jni_wiring            python3 scripts/check_jni_wiring.py
          run_check kotlin_wrapper_wiring python3 scripts/check_kotlin_wrapper_wiring.py
          run_check header_wiring         python3 scripts/check_header_wiring.py
          run_check test_determinism      python3 scripts/check_test_determinism.py
          run_check rt_safety             python3 scripts/check_rt_safety.py
          run_check "Fase 0 — verdad de los 10 ejes (10D)" python3 scripts/check_10d_axis_truth.py
          run_check build_flags           python3 scripts/check_build_flags.py
          run_check docs_claims           python3 scripts/check_docs_claims.py
          run_check datasets_deploy       python3 scripts/check_datasets_deploy.py
          run_check kernel_loader         python3 -m unittest discover -s tests -p 'test_kernel_loader.py'
          run_check arcore_manifest       python3 scripts/check_arcore_manifest.py
          run_check magisk_install        python3 scripts/check_magisk_install.py
          if command -v cppcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck; }; then
            run_check cppcheck cppcheck --error-exitcode=1 --quiet --platform=unix64 --suppress=missingIncludeSystem \
              app/src/main/cpp/omega_effect.cpp \
              app/src/main/cpp/IvannaFusionCore.cpp
          else
            echo "::error title=Fase 0 · cppcheck::no se pudo instalar cppcheck"; rc=1
          fi
          exit $rc

      - name: Resumen
        if: always()
        run: echo "Puerta de tests host ejecutada (san=${IVANNA_SAN:-none}). Cualquier fallo aquí es una regresión DSP real o un test roto — no se ignora."

  # ── BANCO ADVERSARIAL: carril propio, no bloquea la puerta principal ─────
  # Proyecto CTest independiente (tests/adversarial): generador de 21 casos
  # + harness de medición. Corre en su propio job para no mezclar su
  # CTest con la suite principal (que tiene su propio conteo y sus puertas).
  # Cierre 2026-11-21: enganchado a CI; si este job falla, el banco detectó
  # un defecto real o su harness está roto — no se ignora, pero no tumba
  # la puerta de CTest principal (que corre en el job `ctest`).
  adversarial-bank:
    name: Banco adversarial (7 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar g++-14 y cmake
        run: |
          if ! command -v g++-14 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq g++-14
          fi
          g++-14 --version | head -1
          cmake --version || { sudo apt-get update -qq && sudo apt-get install -y -qq cmake; }
          cmake --version | head -1

      - name: Configurar, compilar y correr el banco adversarial
        run: |
          set -o pipefail
          cmake -S tests/adversarial -B build-adversarial -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-adversarial -j
          ctest --test-dir build-adversarial --output-on-failure

      - name: Resumen
        if: always()
        run: echo "Banco adversarial ejecutado (7/7 esperado). Un fallo aquí = el harness detectó un defecto o está roto."

  # ── CARRIL TSan: semanal + manual — NO bloquea pushes ──────────────────────
  # Evidencia de por qué NO va en la matriz de la puerta: corridas
  # 34166260673 y 34167465625 — cancelado a los 20m15s (timeout 20) y luego a
  # los 45m15s (timeout 45), en pleno CTest. 90 min = 2x el peor caso medido.
  ctest-tsan:
    name: CTest (TSan, carril semanal)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # FIX v2.5.411 — mismo motivo que el job ctest: clang-18 no compila el
    # <format> de libstdc++-15 del runner. g++-14 (ver comentario arriba).
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      IVANNA_SAN: 'tsan'
    steps:
      - uses: actions/checkout@v7

      - name: Instalar g++-14 (compilador CTest; ver fix v2.5.411 arriba)
        run: |
          if ! command -v g++-14 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq g++-14
          fi
          g++-14 --version | head -1

      - name: Instalar cmake
        run: |
          cmake --version || { sudo apt-get update -qq && sudo apt-get install -y -qq cmake; }
          cmake --version | head -1

      - name: Pre-flight — sin presets fantasma
        run: bash -n scripts/run_ctest.sh

      - name: CTest completo con ThreadSanitizer
        run: bash scripts/run_ctest.sh

      # C5 (510) — mismo artefacto que en el job `ctest`: el carril TSan
      # también genera ctest_last.log + ctest_junit.xml vía run_ctest.sh
      # y también puede morir por timeout (90 min).
      - name: Publicar artefactos CTest (log + JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-tsan
          path: |
            build/tests-host/ctest_last.log
            build/tests-host/ctest_junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Resumen
        if: always()
        run: echo "Carril TSan ejecutado. Un fallo aquí = data race real en el DSP — prioridad máxima de investigación."

  # ── Validación de datasets HRTF distribuidos (pipeline HRTF-tools + Tests host) ──
  # Pendiente heredado del relevo HRTF-tools: verify_dataset.py existía pero
  # nadie lo corría en CI — un dataset mutilado (como hrtf_database.bin, que
  # estuvo roto por codec UTF-8) podía volver a colarse en un release sin que
  # nadie se enterara. Layout derivado línea a línea de HRTFBinLoader.cpp.
  hrtf-datasets:
    name: Datasets HRTF (todos los distribuidos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # FIX (corrida 34543348492): la versión vigente de verify_dataset.py
      # (del relevo HRTF-tools) usa numpy a nivel de módulo y el runner
      # ubuntu-latest no lo trae — ModuleNotFoundError. numpy es dependencia
      # oficial del propio script (pip install sofar numpy, como sofa_to_ihr1).
      - name: Instalar numpy (dependencia del validador)
        run: pip install --quiet numpy

      # NOTA CLI: el validador vigente (relevo HRTF-tools) trata TODO argumento
      # como ruta de dataset (sys.argv[1:], sin opciones) — el motor corre a
      # 48000 y todos los datasets ya están a 48000 (verificado en los PASS).
      - name: Validar los 13 datasets IHR1 contra el layout del lector C++
        run: |
          set -o pipefail
          python3 tools/hrtf/verify_dataset.py \
            app/src/main/assets/ivanna_omega/hrtf/*.ihr1 \
            magisk_module/system/etc/ivanna_omega/hrtf/*.ihr1 \
            | tee /tmp/hrtf-validation.log
          COUNT=$(grep -c "^PASS" /tmp/hrtf-validation.log || true)
          FAILS=$(grep -c "^FAIL" /tmp/hrtf-validation.log || true)
          EXPECTED=$(ls app/src/main/assets/ivanna_omega/hrtf/*.ihr1 \
            magisk_module/system/etc/ivanna_omega/hrtf/*.ihr1 | wc -l)
          # Conteo DINÁMICO: todo dataset presente debe PASSear (24 hoy —
          # verificado en local: exit 0, 24 PASS, 0 FAIL; la nota del relevo
          # decía 13 pero el find real cuenta 24 = 12 assets + 12 módulo).
          [ "$FAILS" = "0" ] && [ "$COUNT" = "$EXPECTED" ] || {
            echo "::error::Datasets HRTF: $FAILS FAIL y $COUNT/$EXPECTED PASS — dataset faltante o ilegible: no se publica"; exit 1
          }

      - name: Resumen
        if: always()
        run: echo "Puerta de datasets HRTF — cualquier FAIL impide que un binario ilegible por HRTFBinLoader llegue al APK (no se ignora)."

  # ── DEH6 Optics: paquete de investigación y prototipo numérico ─────────────
  deh6-optics:
    name: DEH6 Optics (Tests numéricos y CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install --quiet numpy
      - name: Ejecutar tests y CLI de validación
        run: |
          cd research/deh6_optics
          python3 -m unittest discover -s tests -v
          python3 -m deh6_optics.cli --config examples/target.json --out build/deh6-demo
      - name: Resumen
        if: always()
        run: echo "Puerta DEH6 Optics ejecutada con éxito."
