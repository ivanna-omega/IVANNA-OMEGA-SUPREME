  - id: cap-005
    nombre: "NEU·Ω — Compilador Espectral Holográfico"
    objetivo: >
      Compilar la cadena entera en una matriz compleja 2×2 por banda cada
      hop; el audio pasa por el dominio espectral una sola vez (FFTs por hop
      de 10 a 2); cola difusa sumada en frecuencia antes del único IFFT.
    implementacion:
      - app/src/main/cpp/spatial/NeuCompiler.hpp
      - app/src/main/cpp/spatial/SpectralCore.hpp
      - docs/analysis-ivanna/NEU-Omega_Compilador_Espectral_Holografico.md (privado, NO en repo)
    ruta_ejecucion: Ruta A (Fase 6 cableada en v2.5.436, OFF por defecto)
    controles:
      neu_omega_enabled: { defecto: false }
    estado: VERIFICADA EN HOST
    target_state: VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE
    evidencia:
      - Fase 0 completa; Fases 1 y 2 verificadas en host; E2/E3 pasan en
        local con margen (corrección de Esse — criterio bit-idéntico 1e-6
        reemplazado por equivalencia medible en dB; solo E1 sigue exacta).
      - Bug real encontrado y documentado — SpectralCore::prepare() usaba
        fTop = 0.5f * sr_ en vez de min(16000, 0.45*sr); fix para la 442.
      - CI roja en el leg plano "Tests host (CTest)" por 6 categorías
        latentes preexistentes de Fase 0; no bloquea publicación.
    pruebas:
      - E1 (exacta), E2/E3 (equivalencia en dB) en host
    limites:
      - OFF por defecto; sin verificación en dispositivo; E2 broadband
        pendiente (tonos aislados no son un E2 válido).
    criterio_aceptacion: >
      E2 broadband en host + activación en dispositivo con medición de
      latencia/coste y ABX.

