# Tests host en el runner self-hosted ivanna-vm (esta VM).
# Existe porque los runners hospedados por GitHub están bloqueados por
# facturación en golozotns-art (2026-11-23): "recent account payments have
# failed or your spending limit needs to be increased". Los runners
# self-hosted no consumen minutos de GitHub Actions, así que la suite
# C++ se verifica aquí gratis. No toca la release (build.yml sigue siendo
# el pipeline de publicación; este workflow solo verifica tests).
# El runner vive en /home/runner/actions-runner (usuario runner, servicio
# systemd actions.runner.golozotns-art-IVANNA-OMEGA-SUPREME.ivanna-vm).
# Tras un reemplazo de VM se restaura con
# ~/workspace/github-runner-recover.sh (ver AGENTS.md).
#
# Checkout SIN actions/checkout (2026-11-28): el job fallaba en el
# checkout por el scrub de hatch-git (plataforma, solo lectura, no
# arreglable desde adentro). El repo es público, así que se clona
# anónimo y se fija el SHA exacto que disparó el run. La caché
# (actions/cache) acelera los reruns: pip y el dir de build. ccache NO
# está instalado en el runner y NO se instala aquí; el dir de build
# cacheado cumple la misma función, y si algún día se instala ccache su
# CCACHE_DIR debe vivir bajo el workspace del runner (o /home/runner),
# NUNCA en ~/workspace (el usuario runner no lo puede leer).

name: Tests host (self-hosted ivanna-vm)

on:
  push:
    branches: ["main"]
  # C4/510 — la pata ASan+UBSan vive aquí (job ctest-selfhosted-asan) y la
  # puerta hosted (tests-host.yml) ya no la corre: el self-hosted tiene que
  # dispararse también en PR, con las mismas rutas que tests-host.yml, para
  # que el PR no fusione sin ASan. Sin minutos de GitHub (runner propio).
  pull_request:
    paths:
      - 'app/src/main/cpp/**'
      - 'tests/**'
      - 'scripts/run_ctest.sh'
      - 'scripts/check_*.py'
      - 'README.md'
      - 'LÉAME.md'
      - 'telemetry/**'
      - 'magisk_module/module.prop'
      - 'magisk_module/customize.sh'
      - 'research/deh6_optics/**'
      - '.github/workflows/tests-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida del push anterior que aún esté corriendo:
# la única corrida que importa es la del HEAD (mismo patrón que
# tests-host.yml). En este runner único (ivanna-vm) evita además que los
# jobs ASan de 120 min se encolen detrás de corridas ya obsoletas.
concurrency:
  group: tests-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctest-selfhosted:
    name: DSP Native Tests (host, CTest, self-hosted)
    runs-on: [self-hosted, ivanna-vm]
    timeout-minutes: 120
    env:
      CC: clang-18
      CXX: clang++-18
      CMAKE: /home/runner/cmake-3.30.3-linux-x86_64/bin/cmake
      # C11/510 (línea pendiente) — la CPU por hop del harness es PUERTA
      # DURA aquí (self-hosted, carga conocida), no solo en el carril
      # semanal. El job corre ctest en línea (equivalente a run_ctest.sh)
      # y el test lee esta variable en runtime
      # (test_acoustic_harness.cpp: CpuGateHard); al ser env de job
      # aplica a todos los pasos, incluido el ctest. En hosted sigue
      # siendo solo métrica registrada.
      IVANNA_CPU_GATE_HARD: '1'
    steps:
      # Sin actions/checkout: el runner self-hosted falla en el checkout
      # por el scrub de hatch-git. El repo es público: clon anónimo y
      # checkout del SHA exacto que disparó el run (push a main o
      # workflow_dispatch). Si el workspace ya tiene un clon de un run
      # anterior, se reutiliza (fetch + checkout) en vez de clonar.
      - name: Clone anónimo del repo público
        run: |
          if [ -d .git ]; then
            git fetch --quiet origin
          else
            git clone --quiet https://github.com/ivanna-omega/IVANNA-OMEGA-SUPREME.git .
          fi
          # En pull_request, github.sha es el commit de merge
          # (refs/pull/N/merge), que un fetch normal de ramas no trae.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "pull/${{ github.event.pull_request.number }}/merge"
          fi
          git checkout --quiet ${{ github.sha }}
      # La caché es un acelerador, no una puerta: si el servicio de
      # caché falla, el job sigue (continue-on-error) y reconstruye.
      - name: Cache pip (h5py, numpy)
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/tests-selfhosted.yml') }}
      - name: Cache dir de build CTest
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: build-tests
          key: ctest-build-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/tests/**', '.github/workflows/tests-selfhosted.yml') }}
          restore-keys: |
            ctest-build-${{ runner.os }}-
      - name: Install HDF5 validator
        run: python3 -m pip install --disable-pip-version-check --user --break-system-packages h5py numpy
      - name: Validate every SOFA with a real HDF5 reader
        run: python3 scripts/validate_sofa_hdf5.py .
      - name: SOFA validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_sofa_hdf5.py' -v
      - name: AutoEqManager Kotlin profiles match freshly measured HpIR corpus
        run: python3 -m unittest discover -s tests -p 'test_autoeq_kotlin_matches_extractor.py' -v
      - name: SAFMUS transversal wiring contract
        run: python3 scripts/check_safmus_transversal_wiring.py
      - name: Audio route wiring contract (A/B/C, ASRC and physical outputs)
        run: python3 scripts/check_audio_route_wiring.py
      - name: Adaptive DSP metric provenance contract
        run: python3 scripts/check_adaptive_metric_truth.py
      - name: SAFMUS sync/ASRC numerical reference self-test
        run: python3 sync_asrc.py --self-test
      - name: Hardware Sovereignty release approval gate tests
        run: python3 -m unittest discover -s tests -p 'test_hws_release_approval.py' -v
      - name: Release bump detector regression tests
        run: python3 -m unittest discover -s tests -p 'test_release_bump_detection.py' -v
      - name: SAFMUS sync/ASRC regression tests
        run: python3 -m unittest discover -s tests -p 'test_sync_asrc.py' -v
      - name: Adversarial audio measurement regression suite
        run: python3 -m unittest discover -s tests -p 'test_ivanna_audio_certify.py' -v
      - name: Synthetic signal fault-injection suite
        run: python3 -m unittest discover -s tests -p 'test_ivanna_synthetic_audio_suite.py' -v
      - name: Auditory magnificence gate policy tests
        run: python3 -m unittest discover -s tests -p 'test_ivanna_auditory_gate.py' -v
      - name: Release updater manifest regression tests
        run: python3 -m unittest discover -s tests -p 'test_prepare_release_manifest.py' -v
      - name: Transaural route and RIR crossmix contract tests
        run: python3 -m unittest discover -s tests -p 'test_transaural_route_contract.py' -v
      - name: Configure (Release)
        run: $CMAKE -B build-tests -S app/src/main/cpp/tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: $CMAKE --build build-tests -j2
      - name: Run tests
        run: |
          set -o pipefail
          rc=0
          ctest --test-dir build-tests --output-on-failure 2>&1 | tee ctest_last.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            fails=$(grep -E "^\s*[0-9]+ - .*\(Failed|Timeout|SEGFAULT|Subprocess aborted|Exception" ctest_last.log | sed 's/^ *//' | tr '\n' ';' | cut -c1-600)
            detail=$(grep -E "Failure|Expected|Actual|which is|SUMMARY:|medido:" ctest_last.log | head -8 | tr '\n' ' ' | cut -c1-700)
            echo "::error title=DSP CTest fallido::${fails} | ${detail}"
          fi
          exit $rc

  # ── C4/510 — pata ASan+UBSan, movida desde hosted ─────────────────────────
  # En la 509 el job hosted ASan murió por timeout a los 30 min (1515/1835
  # tests, 0 fallos): un solo job hacía configurar + compilar (enlace ASan
  # de test_acoustic_harness >20 min) + ejecutar 1835 tests en 2 núcleos.
  # Subir el timeout solo movía el muro. La pata completa vive aquí:
  # timeout 120 min, sin minutos de GitHub, y en hosted queda solo la pata
  # plana como puerta rápida (tests-host.yml). Sin los pasos Python del job
  # plano (no dependen del sanitizador). Dir de build propio
  # (build-tests-asan) para no colisionar con build-tests del job plano en
  # el mismo workspace (mismo patrón que build-tests-quarantined en
  # tests-quarantined-weekly.yml). Log propio (ctest_last_asan.log) por el
  # mismo motivo. Sin `needs:`: corre independiente del job plano; un
  # fallo en uno no esconde el resultado del otro (el runner único los
  # ejecuta en serie de todos modos).
  ctest-selfhosted-asan:
    name: DSP Native Tests (ASan+UBSan, CTest, self-hosted)
    runs-on: [self-hosted, ivanna-vm]
    timeout-minutes: 120
    env:
      CC: clang-18
      CXX: clang++-18
      CMAKE: /home/runner/cmake-3.30.3-linux-x86_64/bin/cmake
      # Inocua bajo sanitizador por diseño: test_acoustic_harness.cpp
      # pone hardGate=false con IVANNA_SANITIZER_ACTIVE (el sanitizador
      # infla el CPU 2-3x; mide seguridad de memoria, no rendimiento).
      # Se pone igual por uniformidad con el job plano.
      IVANNA_CPU_GATE_HARD: '1'
    steps:
      # Sin actions/checkout: mismo motivo que el job plano (scrub de
      # hatch-git). Mismo clon anónimo + checkout del SHA del run, con el
      # fetch de la ref de merge en pull_request (ver job plano).
      - name: Clone anónimo del repo público
        run: |
          if [ -d .git ]; then
            git fetch --quiet origin
          else
            git clone --quiet https://github.com/ivanna-omega/IVANNA-OMEGA-SUPREME.git .
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "pull/${{ github.event.pull_request.number }}/merge"
          fi
          git checkout --quiet ${{ github.sha }}
      # SIN actions/cache aquí (CodeQL actions/cache-poisoning, alta,
      # PR #14): el job corre en pull_request (código no confiable) Y en
      # push/workflow_dispatch (rama por defecto); cachear build-tests-asan
      # compartiría la caché entre ambos y CodeQL lo marca como alerta
      # nueva que falla el check. Build limpio cada vez (más lento, pero
      # el job tiene timeout 120 min y el runner es propio, sin minutos).
      - name: Configure (Release, ASan+UBSan)
        run: $CMAKE -B build-tests-asan -S app/src/main/cpp/tests -DCMAKE_BUILD_TYPE=Release -DIVANNA_TEST_ENABLE_ASAN=ON
      - name: Build
        run: $CMAKE --build build-tests-asan -j2
      - name: Run tests (ASan+UBSan)
        run: |
          set -o pipefail
          rc=0
          # -LE QUARANTINED: misma selección que la pata ASan tenía en
          # hosted vía run_ctest.sh. Los tests en cuarentena son de
          # wall-clock y bajo ASan el CPU se infla 2-3x por diseño: sin
          # la exclusión, test_perf_auditor fallaría por carga del
          # sanitizador, no por defecto real. Siguen cubiertos por el
          # job plano self-hosted y el carril semanal.
          ctest --test-dir build-tests-asan --output-on-failure -LE QUARANTINED 2>&1 | tee ctest_last_asan.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            fails=$(grep -E "^\s*[0-9]+ - .*\(Failed|Timeout|SEGFAULT|Subprocess aborted|Exception" ctest_last_asan.log | sed 's/^ *//' | tr '\n' ';' | cut -c1-600)
            detail=$(grep -E "Failure|Expected|Actual|which is|ERROR: AddressSanitizer|runtime error|SUMMARY:|medido:" ctest_last_asan.log | head -8 | tr '\n' ' ' | cut -c1-700)
            echo "::error title=DSP CTest (ASan+UBSan) fallido::${fails} | ${detail}"
          fi
          exit $rc
