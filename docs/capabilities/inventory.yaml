# Inventario de capacidades — IVANNA-OMEGA-SUPREME
# Versión del producto: v2.5.445 (versionCode 736) · Rama: ivanna-real-completa
# Base de evidencia: HEAD 74337b5a (commit que versiona tools/evolution/council.py).
#
# REGLAS DE LECTURA (obligatorias):
# - "Existe el archivo" NO equivale a "funciona". Cada estado se basa en la
#   evidencia citada en `evidencia` (código, tests, mediciones reales).
# - Estados permitidos: IMPLEMENTADA, INTEGRADA, VERIFICADA EN HOST,
#   VERIFICADA EN DISPOSITIVO, VALIDADA PERCEPTUALMENTE, PENDIENTE, BLOQUEADA.
# - CORRECCIÓN L4 (aprobada por Esse, 2026-11-14): el v3 decía "toda
#   capacidad: verificada en dispositivo como mínimo" — error de categoría
#   para capacidades que NO corren en el teléfono (consejo, motor de
#   evolución, puente GitHub, Vista de Dios). El estado objetivo es POR
#   TIPO, campo `target_state` por capacidad:
#     audio/DSP de sonido (criterio con ABX/escucha) ->
#       "VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE" (solo Esse)
#     audio/DSP (resto) -> "VERIFICADA EN DISPOSITIVO"
#     herramientas/infraestructura -> "VERIFICADA EN HOST/CI"
#   La puerta de perfección (scripts/perfection_gate.py) exige target_state
#   en cada capacidad y cuenta como A_MEDIAS toda capacidad por debajo de
#   su objetivo. Un bloqueo solo se cierra con un campo `decision_esse:`
#   registrado en el bloque de la capacidad.
# - Nada en este archivo afirma ventas, acuerdos, sensores ni métricas que no
#   estén en la evidencia citada. 0 vendidos, $0. Bofo sin resolver.
# - Discrepancia conocida y registrada (no ocultada): los atómicos del lado
#   efecto arrancan en 0.0 (bypass) — p. ej. g_orbe_amount, g_holos_amount,
#   g_hyper_amount, g_omni_amount en *_globals_effect.cpp — mientras
#   ParameterStore.kt define los defaults de app ORBE 1.0 / HOLOS 0.5 /
#   Φ 0.5. El valor efectivo depende de que la app los escriba al arrancar;
#   en vivo se observaron amounts bajos (ORBE 0.19 / HOLOS 0.05) y
#   fusion_active=0 en Ruta B antes del 7º reset. Ver cap-014.
#
# Cómo actualizar: al cambiar un estado, citar la evidencia nueva (archivo,
# test, medición con fecha) en `evidencia` y cambiar `ultima_verificacion`.

schema_version: 1
producto: IVANNA-OMEGA-SUPREME
version: v2.5.445
version_code: 736
base_evidencia: a5f67e36
fecha_inventario: "2026-11-15"
nota_estado_general: >
  Ruta B: causa raíz encontrada y corregida en rama (plano de control
  app→daemon roto — SET_PERCEPTUAL_STATE respondía "unsupported" y el
  daemon re-publicaba su default neutro 20 veces/s); verificación en
  dispositivo PENDIENTE de la luz verde de Esse. El bofo ("bofo feo")
  sigue sin resolver; los cortes en BridgePlayer también ocurren en
  Tidal dentro de IVANNA (no solo captura) — instrumentación lista para
  medirlos, escucha en dispositivo PENDIENTE. Puerta de perfección:
  NO PERFECTA (PENDIENTES 2, FALLOS 2, A_MEDIAS 42, BLOQUEOS 3 en
  commit 79cf15a9; ver scripts/perfection_gate.py).

capacidades:
  - id: cap-001
    nombre: ORBE (Binaural Esférico de Campo Cercano)
    objetivo: >
      Binauralización por banda ERB a azimut y distancia continuos
      (0.15–2.0 m) con parallax por head-tracking.
    implementacion:
      - app/src/main/cpp/spatial/OrbeBinaural.hpp
      - app/src/main/cpp/orbe_controls_bridge.cpp (g_orbe_amount, app)
      - app/src/main/cpp/orbe_globals_effect.cpp (g_orbe_amount, audioserver)
      - app/src/main/java/com/ivanna/omega/core/ParameterStore.kt (KEY_ORBE_AMOUNT)
    ruta_ejecucion: Ruta A (BridgePlayer) y Ruta B (efecto AudioFlinger)
    controles:
      orbe_amount: { defecto_app: 1.0, defecto_efecto_atomico: 0.0, rango: "0.0–1.0", persistencia: ParameterStore }
      orbe_distance_m: { defecto_app: 0.35, rango: "0.15–2.0" }
      orbe_spread: { defecto_app: 1.0 }
    estado: INTEGRADA
    target_state: VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE
    evidencia:
      - Código C++ y puentes JNI presentes; defaults de app en ParameterStore.kt:288.
      - Atómico del efecto arranca en 0.0 (orbe_globals_effect.cpp:22); el valor
        efectivo requiere que la app lo escriba. En vivo se observó 0.19.
      - Tracker SO(3) por cuaterniones EN PAUSA por orden de Esse (2026-11-11);
        el parallax por head-tracking no tiene seguidor completo activo.
    pruebas: []
    limites:
      - Sin seguidor SO(3) activo; parallax limitado a la pose disponible.
      - No hay medición perceptual ABX que valide la localización (ver docs/validation/abx-protocol.md).
    criterio_aceptacion: >
      ABX de localización/externalización superado en dispositivo (protocolo
      ABX) + amounts efectivos iguales a los defaults de app en vivo.

  - id: cap-002
    nombre: HOLOS (Operador Único de Campo Acústico)
    objetivo: >
      Un vector de estado por banda en STFT hop 128 / FFT 512; fusión de
      campo acústico en una sola pasada espectral.
    implementacion:
      - app/src/main/cpp/spatial/HolosOperator.hpp
      - app/src/main/cpp/spatial/HolosOperator.cpp
      - app/src/main/cpp/holos_controls_bridge.cpp
      - app/src/main/cpp/holos_globals_effect.cpp
    ruta_ejecucion: Ruta A y Ruta B
    controles:
      holos_amount: { defecto_app: 0.5, defecto_efecto_atomico: 0.0, rango: "0.0–1.0", persistencia: ParameterStore }
      holos_harmonics: { defecto_app: 0.0 }
    estado: INTEGRADA
    target_state: VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE
    evidencia:
      - Código y puentes presentes; defaults de app HOLOS 0.5 / harmonics 0.0
        (ParameterStore.kt:313). Medición citada en memoria — THD+N −94.0 dB
        @1 kHz (retuneo 2026-11-08); no re-medida en este inventario.
      - En vivo se observó amount 0.05 frente al 0.5 declarado.
    pruebas:
      - app/src/main/cpp/tests/test_holos_chain.cpp
    limites:
      - La medición THD+N citada no se reproduce en este inventario; requiere
        re-medición en host y en dispositivo.
    criterio_aceptacion: >
      THD+N re-medido en host y en dispositivo + ABX de preferencia superado.

  - id: cap-003
    nombre: "Φ (Phi) — Hiper-Operador de Estado"
    objetivo: >
      Un Único Operador Matricial Neuro-Electromecánico de Estado Continuo:
      bucle cerrado neural, campos de onda, pre-distorsión Volterra, sensado
      Back-EMF y Bitstream Zero-PCM; muestra a muestra, sin FFT por bloques.
    implementacion:
      - app/src/main/cpp/hyper_controls_bridge.cpp
      - app/src/main/cpp/hyper_globals_effect.cpp
      - docs/HYPER_STATE_OPERATOR.md
    ruta_ejecucion: Ruta A y Ruta B
    controles:
      hyper_amount: { defecto_app: 0.5, defecto_efecto_atomico: 0.0, rango: "0.0–1.0", persistencia: ParameterStore }
    estado: INTEGRADA
    target_state: VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE
    evidencia:
      - Puentes y atómicos presentes; default de efecto 0.0 = bypass
        bit-exacto (hyper_globals_effect.cpp:6-12); default de app 0.5.
      - Diseño documentado en docs/HYPER_STATE_OPERATOR.md; implementado
        como v2.5.369, fail-closed.
      - El componente "neuro on-device" es el NPE con sensor = micrófono del
        teléfono; no hay EEG externo ni hardware de compra.
    pruebas: []
    limites:
      - Sin validación perceptual; el bucle cerrado depende del micrófono del
        teléfono, no de un sensor neural dedicado.
    criterio_aceptacion: >
      ABX de discriminación + preferencia en dispositivo, con el bucle
      cerrado activo, sin regresión de THD+N.

