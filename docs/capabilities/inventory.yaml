  - id: cap-014
    nombre: Ruta B — efecto AudioFlinger + sesión
    objetivo: >
      Efecto en el mezclador (AudioFlinger): procesa la mezcla real en el
      sitio, sin copia, sin delay, sin audio doble. Lo definitivo según
      Esse (2026-11-12).
    implementacion:
