  - id: cap-009
    nombre: ASRC — módulo Magisk / HAL (write-stage PAL)
    objetivo: >
      ASRC dentro del output stream real del HAL (audio.primary.blair.so)
      por write-stage; actuador de ratio en el write-stage porque PAL no
      expone actuador de ratio variable para música.
    implementacion:
      - magisk_module/system/vendor/lib64/libivanna_asrc_write_stage.so
      - magisk_module/system/vendor/lib64/libivanna_asrc_write_stage.so.PROVENANCE.txt
      - magisk_module/asrc_link.sh
      - magisk_module/overlay.d.disabled/ivanna_audio.rc
    ruta_ejecucion: HAL (PAL, card 1 blair) — vía módulo Magisk
    controles:
      kill_switch: { archivo: "pal_asrc.off", efecto: bypass inmediato sin reiniciar }
    estado: BLOQUEADA
    target_state: VERIFICADA EN DISPOSITIVO
    decision_esse: Se mantiene BLOQUEADA hasta la prueba en vivo con voz real (orden de voz → cambio de parámetro verificado); el ASRC funciona y está medido (deriva +58 ppm), falta solo esa prueba. Decisión de Esse 2026-11-20.
    evidencia:
      - El wrapper del HAL está MUERTO (v2.5.403 → bootloop → 6º reset de
        fábrica 2026-11-11) — un módulo Magisk NO puede hacer que init lea
        un .rc al arrancar. NO instalar el zip v2.5.403; NO reintentarlo.
      - overlay.d NO monta el .rc en Magisk 31.1 (verificado en vivo);
        la vía system/ sí hace bind-mount, pero el .rc solo se lee en el
        próximo arranque.
      - Auditoría ASRC v6 — 23 hallazgos, todos corregidos y re-auditados
        (offset mmap 0x2ec180 correcto; pread en vez de dereferencia;
        fstat ≥1008 B; seqlock por sequence).
      - Teléfono limpio tras el 7º reset — sin módulo, sin daemon, sin Ruta B.
    pruebas: []
    limites:
      - Sin vía de instalación segura conocida hoy; cualquier retorno del
        módulo requiere luz verde explícita de Esse y teléfono estable.
    criterio_aceptacion: >
      Vía de carga del HAL demostrada sin bootloop en dispositivo de
      pruebas + kill switch verificado + ASRC midiendo eficaz (THD+N,
      coste, latencia) o reporte de exclusión.

