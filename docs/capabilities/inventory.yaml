        ~0 ppm, THD+N ~−86/−84/−83 dB, underflow 0, coste 3.59% de un core.
      - Archivo ivanna_route_a_asrc.cpp SÍ existe en el repo (la razón
        alegada para no usar RouteAAsrc era incorrecta).
      - Deriva medida 2026-11-07 — 47999.7 vs 48000 Hz (−6.25 ppm); v2
        ~−13 ppm por bocina, ~−70 ppm por USB.
    pruebas:
      - app/src/main/cpp/ivanna_route_a_asrc_test.cpp
      - tests/test_sync_asrc.py
    limites:
