    controles:
      fusion_active: { observado_pre_reset: 0 }
      psi_active: { observado_pre_reset: 0 }
      ratio_asrc: { observado_pre_reset: 1.0 }
    estado: BLOQUEADA
    target_state: VERIFICADA EN DISPOSITIVO + VALIDADA PERCEPTUALMENTE
    decision_esse: Se mantiene BLOQUEADA hasta que el puente reciba diagnóstico real del teléfono con el watcher activo; el efecto Ruta B ya acopla y procesa, lo pendiente es la evidencia de diagnóstico. Decisión de Esse 2026-11-20.
    evidencia:
      - Antes del 7º reset — efecto en cadena (Effect 899, sesión 2169,
        enabled, 1 track activo) pero SIN procesar — fusion_active=0,
        psi_active=0, ratio 1.0, sin frames ni beacon.
      - Pista estática — el estado bajo /data/adb/ivanna_omega es
        inalcanzable para un audioserver no-root (/data/adb es 0700 root
        y ningún script hace chmod); explica ratio 1.0 y frames
        ausentes, pero NO fusion 0 ni el bofo.
      - El log decisivo IvannaOmegaEffect nunca se leyó; no existe en el
        teléfono limpio. El módulo viejo se desecha — uno NUEVO DESDE CERO.
      - Amounts en vivo bajos (ORBE 0.19 / HOLOS 0.05 vs 1.0 / 0.5).
      - CAUSA RAÍZ encontrada en rama 2026-11-15 (commit 9896323d) —
        el plano de control app→daemon estaba roto — la app enviaba
        ORBE/HOLOS por SET_PERCEPTUAL_STATE pero el daemon v2 solo servía
        HELLO/GET_STATUS y respondía "unsupported" a todo SET_*; el bucle
        re-publicaba su default neutro (ORBE 0 / HOLOS 0, bypass bit-exacto)
        20 veces/s. Fix — rama SET_PERCEPTUAL_STATE en el responder +
        drenaje en el bucle antes de applyFusionToSnapshot. Kill switch v2
        corregido a pal_asr.off (684a60ce). Vía LD_PRELOAD retirada del
        módulo (d7bc98ae). Telemetría ASRC corregida uint32→uint64
        (a7f649d4). Doctor con 3 puertas nuevas (d772c9b9).
        Procedimientos en docs/09-operations/route-b-*.md. Verificación
        en dispositivo PENDIENTE de la luz verde de Esse.
    pruebas: []
    limites:
      - Teléfono limpio tras el 7º reset — no hay módulo, daemon ni Ruta B.
        Reconstrucción pendiente con luz verde de Esse.
      - fusion_active=1 es imposible sin músculo HAL (retirado por diseño);
        la señal real de procesado es el beacon (effect_state==2 +
        dsp_frames creciendo), no fusion_active.
    criterio_aceptacion: >
      Efecto acoplado a sesión viva + fusion_active=1 + frames procesados
      medidos + log IvannaOmegaEffect leído + ABX en dispositivo.

